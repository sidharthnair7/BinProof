# BinProof Spring Boot backend: same API and same web page as the Node server, on port 8080.
# It reads the same data/ folder and deployment.json, and talks to the same local chain.
server.port=8080
binproof.root=..
binproof.rpc=http://127.0.0.1:8545
binproof.ollama=http://localhost:11434
binproof.model=gemma4:e4b-it-qat
spring.web.resources.static-locations=file:${binproof.root}/frontend/
spring.servlet.multipart.enabled=false
server.tomcat.max-swallow-size=-1
spring.codec.max-in-memory-size=10MB
