  : html`<b style=${{ fontSize: 22, color: "#fff" }}>?</b>`;

const Logo = () => html`<svg width="46" height="46" viewBox="0 0 48 48" aria-hidden="true">
  <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b5bfd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect x="1" y="1" width="46" height="46" rx="13" fill="url(#lg)"/>
  <path d="M15 17h18l-2 19a3 3 0 0 1-3 2.7h-8A3 3 0 0 1 17 36z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M13 17h22M20 17v-3h8v3" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M19.5 27.5l3 3 6-6.5" fill="none" stroke="#a5f3fc" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function Count({ value, decimals = 1, suffix = "" }) {
  const ref = useRef(null); const prev = useRef(0);
  useEffect(() => { const c = animate(prev.current, value, { duration: .9, ease: "easeOut",
    onUpdate: (v) => { if (ref.current) ref.current.textContent = v.toFixed(decimals) + suffix; } }); prev.current = value; return () => c.stop(); }, [value]);
  return html`<span ref=${ref}>${value.toFixed(decimals)}${suffix}</span>`;
}

function Ring({ pct }) {
  const r = 46, c = 2 * Math.PI * r;
  return html`<svg width="120" height="120" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r=${r} fill="none" stroke="#e6ebf2" stroke-width="12"/>
    <${motion.circle} cx="60" cy="60" r=${r} fill="none" stroke=${pct > 20 ? "#d93d42" : "#1c9a63"} stroke-width="12" strokeLinecap="round"
      strokeDasharray=${c} initial=${{ strokeDashoffset: c }} animate=${{ strokeDashoffset: c * (1 - Math.min(pct, 100) / 100) }}
      transition=${{ duration: 1, ease: "easeOut" }} transform="rotate(-90 60 60)"/></svg>`;
}

const Card = ({ children, className = "", i = 0 }) => html`<${motion.div} className=${"card " + className}
  initial=${{ opacity: 0, y: 14, filter: "blur(4px)" }} animate=${{ opacity: 1, y: 0, filter: "blur(0px)" }} transition=${{ ...spring, delay: i * .08 }}>${children}<//>`;

// Where a drop went, in the resident's words.
const ROUTE = {
  recycling: (c) => [c ? "bad" : "ok", c ? "In recycling, but it doesn't belong" : "Sorted to recycling"],
  diverted: () => ["bad", "Diverted to garbage"],
  to_organics: () => ["bad", "Diverted to organics"],
  review: () => ["warn", "Sent to the review tote"],
  garbage: () => ["ok", "Sorted to garbage"],
  organics: () => ["ok", "Sorted to organics"],
};
// Routes where the sorter sent the drop out of the recycling stream (same list as Ledger.LEFT_RECYCLING).
const LEFT_RECYCLING = ["diverted", "to_organics"];
const routeOf = (v) => (ROUTE[v.route] || ((c) => [c ? "bad" : "ok", c ? "Doesn't belong" : "Belongs"]))(v.contaminated);
const STREAMS = [["RECYCLING", "Recycling", "#3b5bfd"], ["GARBAGE", "Garbage", "#5b6478"], ["ORGANICS", "Organics", "#2f9e6a"]];

function Verdict({ v, eventSha, loading }) {
  if (loading) return html`<${motion.div} className="verdict warn" initial=${{ opacity: 0 }} animate=${{ opacity: 1 }}>
    <div className="badge"><${motion.div} style=${{ width: 18, height: 18, border: "3px solid #fff", borderTopColor: "transparent", borderRadius: "50%" }}
      animate=${{ rotate: 360 }} transition=${{ repeat: Infinity, duration: .8, ease: "linear" }}/></div>
    <div><b>Looking…</b><small>The sorter camera describes the drop. The rules decide where it goes.</small></div><//>`;
  if (!v) return html`<p className="hint">Tap a fob, press a stream button, then <b>Drop it down the chute</b>.</p>`;
  const [kind, head] = routeOf(v);
  return html`<${motion.div} key=${eventSha} className=${"verdict " + kind} initial=${{ opacity: 0, scale: .94, y: 10 }} animate=${{ opacity: 1, scale: 1, y: 0 }} transition=${spring}>
    <${motion.div} className="badge" initial=${{ scale: 0 }} animate=${{ scale: 1 }} transition=${{ ...spring, delay: .05 }}><${Icon} kind=${kind === "warn" ? "warn" : kind}/><//>
    <div style=${{ flex: 1 }}><b>${head}</b><small>${v.item} · ${v.reason}</small>
      <div className="conf"><${motion.i} initial=${{ width: 0 }} animate=${{ width: (v.confidence * 100) + "%" }} transition=${{ duration: .8 }}/></div>
      <div className="mono" style=${{ marginTop: 8 }}>camera saw ${v.detected || v.category} (${v.bag || "loose"}) · confidence ${(v.confidence * 100).toFixed(0)}% · ${v.model} · ${(v.ms / 1000).toFixed(1)}s<br/>photo sha256 ${short(eventSha)} · photo kept on the sorter's device</div>
    </div><//>`;
}

const Sim = ({ label, children }) => html`<div style=${{ marginTop: 12 }}><div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
  <label className="f" style=${{ margin: 0 }}>${label}</label><span className="tag" style=${{ background: "#eef1f6", borderStyle: "solid" }}>SIMULATED</span></div>${children}</div>`;

function BinTab({ state, refresh, onDisposed }) {
  const video = useRef(null); const [cam, setCam] = useState(false); const [still, setStill] = useState(null);
  const [unit, setUnit] = useState("1203"); const [floor, setFloor] = useState(12); const [stream, setStream] = useState("RECYCLING");
  const [metal, setMetal] = useState(0); const [weight, setWeight] = useState(1.2);
  const [busy, setBusy] = useState(false); const [res, setRes] = useState(null); const [err, setErr] = useState("");
  useEffect(() => { navigator.mediaDevices?.getUserMedia({ video: { facingMode: "environment" } })
    .then((s) => { if (video.current) { video.current.srcObject = s; setCam(true); } }).catch(() => setCam(false)); }, []);
  const toJpeg = (src, w, h) => { const k = Math.min(1, 1024 / Math.max(w, h)); const c = document.createElement("canvas");
    c.width = Math.round(w * k); c.height = Math.round(h * k); c.getContext("2d").drawImage(src, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", .85); };
  const dispose = async (image) => {
    setStill(image); setBusy(true); setErr("");
    try { const r = await api("/api/dispose", { unit, floor, stream, metal, weightKg: weight, image }); setRes(r); onDisposed(r.event.eventId); }
    catch (e) { setErr(e.message); } setBusy(false); refresh();
  };
  const snap = () => { const v = video.current; if (v?.videoWidth) dispose(toJpeg(v, v.videoWidth, v.videoHeight)); };
  const file = (e) => { const f = e.target.files[0]; if (!f) return; const img = new Image();
    img.onload = () => { dispose(toJpeg(img, img.naturalWidth, img.naturalHeight)); URL.revokeObjectURL(img.src); }; img.src = URL.createObjectURL(f); e.target.value = ""; };
  const open = state.events.filter((e) => !e.batchId && (e.stream || "RECYCLING") === "RECYCLING" && !LEFT_RECYCLING.includes(e.route)).length;
  const review = state.events.filter((e) => e.needsReview);
  return html`<div className="grid">
    <${Card} i=${0}><h2>The chute, floor by floor</h2>
      <p className="hint">At the chute door: the resident's fob and the stream button. At the bottom: the sorter camera.</p>
      <div className="row" style=${{ marginTop: 0 }}>
        <div style=${{ flex: 1, minWidth: 120 }}><label className="f" htmlFor="unit">Fob tap (unit)</label><input id="unit" value=${unit} onInput=${(e) => setUnit(e.target.value)}/></div>
        <div style=${{ width: 110 }}><label className="f" htmlFor="floor">Floor</label><input id="floor" type="number" min="1" max="60" value=${floor} onInput=${(e) => setFloor(Number(e.target.value) || 1)}/></div>
      </div>
      <label className="f">Stream button</label>
      <div className="row" style=${{ marginTop: 0 }} id="streams">${STREAMS.map(([id, label, c]) => html`<button key=${id} data-stream=${id}
        className=${"btn " + (stream === id ? "green" : "alt")} style=${stream === id ? { background: c } : {}} onClick=${() => setStream(id)}>${label}</button>`)}</div>
      <div className="cam" style=${{ marginTop: 14 }}>
        <video ref=${video} autoPlay playsInline muted style=${{ display: still || !cam ? "none" : "block" }}></video>
        ${still && html`<img src=${still} alt="drop"/>`}
        ${!still && !cam && html`<div className="empty">No camera here: use a photo instead.</div>`}
        ${busy && html`<${motion.div} className="scan" initial=${{ top: "0%" }} animate=${{ top: ["0%", "97%", "0%"] }} transition=${{ duration: 1.6, repeat: Infinity, ease: "easeInOut" }}/>`}
        <div style=${{ position: "absolute", left: 12, top: 10, color: "#fff", font: '600 12px "Inter Tight"', opacity: .8 }}>Sorter camera · floor ${floor} chute</div>
      </div>
      <${Sim} label=${`Metal detector: ${metal.toFixed(2)}`}><input type="range" id="metal" min="0" max="1" step="0.05" value=${metal} onInput=${(e) => setMetal(Number(e.target.value))} style=${{ width: "100%", padding: 0 }}/><//>
      <${Sim} label=${`Weight on the catch flap: ${weight.toFixed(1)} kg`}><input type="range" id="weight" min="0" max="8" step="0.1" value=${weight} onInput=${(e) => setWeight(Number(e.target.value))} style=${{ width: "100%", padding: 0 }}/><//>
      <div className="row">
        <button className="btn green" id="snap" disabled=${busy} onClick=${snap}>Drop it down the chute</button>
        <label className="btn alt" style=${{ margin: 0 }}>Use a photo<input type="file" id="file" accept="image/*" className="hide" onChange=${file}/></label>
      </div>
      <p className="hint" style=${{ marginTop: 12, marginBottom: 0, fontSize: 13 }}>Hardware not built. The floor panel and the sorter's sensors are simulated inputs set by the presenter; the camera verdict is real.</p><//>
    <${Card} i=${1}><h2>What the sorter decided</h2><p className="hint">The camera describes. The stream button and the rules decide. Unsure goes to a person.</p>
      <div id="verdict">${err ? html`<div className="verdict bad"><div className="badge"><${Icon} kind="bad"/></div><div><b>Error</b><small>${err}</small></div></div>`
        : html`<${Verdict} v=${res?.verdict} eventSha=${res?.event.imageSha256} loading=${busy}/>`}</div>
      ${review.length > 0 && html`<h2 style=${{ marginTop: 22 }}>Review tote <span className="tag">${review.length} for the superintendent</span></h2>
        <div className="list">${review.slice(0, 4).map((e) => html`<div key=${e.eventId} className="item" style=${{ gridTemplateColumns: "1fr auto" }}>
          <div><b>Floor ${e.floor ?? "?"}</b> · ${e.stream || ""} · ${e.item}</div>
          <div><button className="btn alt" style=${{ padding: "4px 9px", fontSize: 13 }} onClick=${async () => { await api(`/api/review/${e.eventId}`, { contaminated: false }); refresh(); }}>It's fine</button>
            <button className="btn alt" style=${{ padding: "4px 9px", fontSize: 13, marginLeft: 4 }} onClick=${async () => { await api(`/api/review/${e.eventId}`, { contaminated: true }); refresh(); }}>Contamination</button>
            <button className="btn alt" style=${{ padding: "4px 9px", fontSize: 13, marginLeft: 4 }} onClick=${async () => { await api(`/api/review/${e.eventId}`, { contaminated: true, divert: true }); refresh(); }}>Divert</button></div></div>`)}</div>`}
      <h2 style=${{ marginTop: 22 }}>Recent drops <span className="tag">${open} in recycling, waiting for pickup</span></h2>
      <div className="list" id="events"><${AnimatePresence} initial=${false}>${state.events.slice(0, 8).map((e) => { const [k, h] = routeOf(e); return html`
        <${motion.div} layout key=${e.eventId} className="item" initial=${{ opacity: 0, x: -24 }} animate=${{ opacity: 1, x: 0 }} exit=${{ opacity: 0 }} transition=${spring}>
          <div><b>${e.floor ? "Fl " + e.floor : e.unit}</b>${e.seeded && html`<span className="tag">seeded</span>`}</div>
          <div>${e.item}<div className="mono" style=${{ fontSize: 11 }}>${e.stream || ""}${e.detected ? " · saw " + e.detected : ""}</div></div>
          <div><span className=${"pill " + k}>${h}</span>${e.batchId && html`<span className="tag">picked up</span>`}</div><//>`; })}<//></div><//>
  </div>`;
}

// Contamination by floor: the view a property manager acts on.
function FloorsCard({ state }) {
  const drops = state.events.filter((e) => e.floor && (e.stream || "RECYCLING") === "RECYCLING");
  const floors = {}; drops.forEach((e) => { const f = floors[e.floor] ||= { n: 0, bad: 0, bags: 0 }; f.n++; if (e.contaminated) f.bad++; if (e.route === "diverted") f.bags++; });
  const rows = Object.entries(floors).map(([f, v]) => [Number(f), v]).sort((a, b) => b[1].bad / b[1].n - a[1].bad / a[1].n).slice(0, 8);
  const bags = drops.filter((e) => e.route === "diverted").length; const food = drops.filter((e) => e.route === "to_organics").length;
  return html`<${Card} i=${2}><h2 id="floors">By floor</h2><p className="hint">Recycling-stream drops per floor. Residents get floor-level feedback; no one is named.</p>
    <div className="row" style=${{ marginTop: 0, marginBottom: 10 }}><span className="pill bad">${bags} black bags diverted</span><span className="pill bad">${food} food drops sent to organics</span><span className="pill warn">${state.events.filter((e) => e.needsReview).length} in review</span></div>
    ${rows.map(([f, v]) => { const pct = 100 * v.bad / v.n; return html`<div key=${f} style=${{ display: "grid", gridTemplateColumns: "64px 1fr 56px", gap: 10, alignItems: "center", margin: "7px 0" }}>
      <b>Floor ${f}</b><div style=${{ height: 10, borderRadius: 6, background: "#eef1f6", overflow: "hidden" }}><${motion.div} initial=${{ width: 0 }} animate=${{ width: pct + "%" }} transition=${{ duration: .8 }}
        style=${{ height: "100%", background: pct > 30 ? "#e5484d" : pct > 0 ? "#f5b942" : "#2fbf7f" }}/></div><span className="mono">${pct.toFixed(0)}%</span></div>`; })}<//>`;
}

const statusClass = (s) => s === "Verified" ? "ok" : s === "Flagged" ? "bad" : "warn";

function BuildingTab({ state, refresh }) {
  const [busy, setBusy] = useState(false); const [msg, setMsg] = useState(""); const [claimMsg, setClaimMsg] = useState({});
  const open = state.events.filter((e) => !e.batchId && !e.needsReview && (e.stream || "RECYCLING") === "RECYCLING" && !LEFT_RECYCLING.includes(e.route)); const dirty = open.filter((e) => e.contaminated).length;
  const pct = open.length ? 100 * dirty / open.length : 0;
  const pickup = async () => { setBusy(true); setMsg("Committing…");
    try { const b = await api("/api/pickup", {}); setMsg(`Pickup #${b.number}: ${b.items} items sealed · root ${short(b.root)} · tx ${short(b.tx.commit)}`); }
    catch (e) { setMsg(e.message); } setBusy(false); refresh(); };
  const claim = async (id) => {
    try { const r = await api(`/api/claim/${id}`, {}); setClaimMsg((m) => ({ ...m, [id]: { ok: true, text: `claimed · tx ${short(r.tx)}` } })); }
    catch (e) { setClaimMsg((m) => ({ ...m, [id]: { ok: false, text: `Refused by the contract: ${e.message}`, t: Date.now() } })); }
    refresh(); };
  const d = state.deployment;
  return html`<div className="grid">
    <${Card} i=${0}><h2>This building's recycling</h2><p className="hint">Recycling drops waiting for the next pickup.</p>
      <div className="gauge"><${Ring} pct=${pct}/><div><div className="bignum" style=${{ color: pct > 20 ? "var(--red)" : "var(--green)" }}><${Count} value=${pct} suffix="%"/></div>
        <div className="hint" style=${{ margin: 0 }}>contamination in ${open.length} items</div></div></div>
      <p className="hint" style=${{ marginTop: 14 }}>Toronto's audited Blue Box contamination in 2025 was <b>35.4%</b>. In a tower, hundreds of units share one chute.</p>
      <div className="row"><button className="btn green" id="pickup" disabled=${busy} onClick=${pickup}>Pickup: commit batch on chain</button></div>
      <${AnimatePresence}>${msg && html`<${motion.div} key=${msg} className="mono" initial=${{ opacity: 0, y: 6 }} animate=${{ opacity: 1, y: 0 }} style=${{ marginTop: 10 }}>${msg}<//>`}<//><//>
    <${Card} i=${1}><h2>How a pickup becomes a claim</h2><p className="hint">Two parties, two keys, one contract.</p>
      ${["Building seals the items into a Merkle tree and signs the root", "Facility measures the load and signs its own number", "Contract compares: within 10 points is Verified", "One verified pickup, one claim. Never two."]
        .map((s, k) => html`<${motion.div} key=${k} initial=${{ opacity: 0, x: 16 }} animate=${{ opacity: 1, x: 0 }} transition=${{ ...spring, delay: .15 + k * .08 }}
          style=${{ display: "flex", gap: 12, alignItems: "center", padding: "10px 0", borderBottom: k < 3 ? "1px solid var(--line)" : 0 }}>
          <span className="pill ok" style=${{ minWidth: 30, justifyContent: "center" }}>${k + 1}</span><span>${s}</span><//>`)}<//>
    <${FloorsCard} state=${state}/>
    <${Card} className="span2" i=${2}><h2>Pickups</h2><p className="hint">${d ? `Contract ${short(d.address)} · building ${short(d.building)} · facility ${short(d.facility)} · tolerance ${d.toleranceBps / 100} points` : "Contract not deployed."}</p>
      <div className="list" id="batches"><${AnimatePresence} initial=${false}>${state.batches.length ? state.batches.slice().reverse().map((b) => {
        const cm = claimMsg[b.batchId];
        return html`<${motion.div} layout key=${b.batchId} className="pickup" initial=${{ opacity: 0, y: -14 }} animate=${{ opacity: 1, y: 0 }} transition=${spring}>
          <div className="num">#${b.number}</div>
          <div><div className="hint" style=${{ margin: 0 }}>Bin AI says</div><b style=${{ fontSize: 22 }}>${b.binPct.toFixed(1)}%</b> <span className="tag">${b.items} items${b.seeded ? `, ${b.seeded} seeded` : ""}</span>
            <div><span className="chip">⛓ ${short(b.tx.commit)}</span></div></div>
          <div><div className="hint" style=${{ margin: 0 }}>Facility measured</div><b style=${{ fontSize: 22 }}>${b.facilityPct === null ? "–" : b.facilityPct.toFixed(1) + "%"}</b>
            ${b.tx.measurement && html`<div><span className="chip">⛓ ${short(b.tx.measurement)}</span></div>`}</div>
          <div><span className=${"pill " + statusClass(b.status)}>${b.status}</span></div>
          <div>${b.status === "Verified" && html`<button className="btn alt" onClick=${() => claim(b.batchId)}>${b.claimed ? "Claim again" : "Issue claim"}</button>`}
            ${cm ? html`<${motion.div} key=${cm.t || "ok"} className="mono" style=${{ marginTop: 6, color: cm.ok ? "var(--green)" : "var(--red)", fontWeight: 600 }}
                initial=${{ x: 0 }} animate=${cm.ok ? { x: 0 } : { x: [0, -10, 10, -8, 8, -4, 0] }} transition=${{ duration: .5 }}>${cm.text}<//>`
              : b.tx.claim && html`<div className="mono" style=${{ marginTop: 6 }}>claimed · tx ${short(b.tx.claim)}</div>`}</div><//>`; })
        : html`<p className="hint">No pickups yet.</p>`}<//></div><//>
    <${Card} className="span2" i=${3}><div className="row" style=${{ marginTop: 0, justifyContent: "space-between" }}>
      <div><h2>The Seal</h2><p className="hint" style=${{ margin: 0 }}>See each pickup as the tree the building signed, in 3D, and test any item against the contract.</p></div>
      <button className="btn green" onClick=${() => { location.hash = "seal"; dispatchEvent(new HashChangeEvent("hashchange")); }}>Open The Seal →</button></div><//>

function FacilityTab({ state, refresh }) {
  const waiting = state.batches.filter((b) => b.status === "Committed");
  const [sel, setSel] = useState(""); const [pct, setPct] = useState("36"); const [out, setOut] = useState(null);
  const current = waiting.find((b) => b.batchId === sel) || waiting[0];
  const tol = (state.deployment?.toleranceBps || 1000) / 100; const bin = current?.binPct ?? 0; const fac = Number(pct) || 0;
  const report = async () => { if (!current) return;
    try { const r = await api(`/api/facility/${current.batchId}`, { contaminationPct: Number(pct) }); setOut({ ...r, n: current.number }); }
    catch (e) { setOut({ status: "Refused", error: e.message }); } refresh(); };
  const x = (v) => `${Math.max(0, Math.min(100, v))}%`;
  return html`<div className="grid">
    <${Card} i=${0}><h2>Recycling facility audit</h2><p className="hint">The facility samples the load and signs its own measurement with its own key.</p>
      <label className="f" htmlFor="batchSel">Pickup</label>
      <select id="batchSel" value=${current?.batchId || ""} onChange=${(e) => setSel(e.target.value)}>
        ${waiting.length ? waiting.map((b) => html`<option key=${b.batchId} value=${b.batchId}>Pickup #${b.number}: building says ${b.binPct.toFixed(1)}%</option>`)
          : html`<option value="">No pickups waiting for a measurement</option>`}</select>
      <label className="f" htmlFor="pct">Measured contamination (%)</label>
      <input id="pct" type="number" min="0" max="100" step="0.1" value=${pct} onInput=${(e) => setPct(e.target.value)}/>
      <div className="row"><button className="btn green" id="report" onClick=${report}>Sign measurement</button></div>
      <${AnimatePresence} mode="wait">${out && html`<${motion.div} key=${out.tx || out.error} className=${"verdict " + (out.status === "Verified" ? "ok" : "bad")} style=${{ marginTop: 16 }}
        initial=${{ opacity: 0, scale: .95 }} animate=${{ opacity: 1, scale: 1 }} transition=${spring}>
        <div className="badge"><${Icon} kind=${out.status === "Verified" ? "ok" : "bad"}/></div>
        <div><b>${out.status === "Verified" ? "Verified: the building and the facility agree" : out.status === "Flagged" ? "Flagged: the building and the facility disagree" : "Refused"}</b>
          <small>${out.status === "Verified" ? "One diversion claim can now be issued for this pickup." : out.status === "Flagged" ? "No claim can be issued. Someone has to look at this load." : out.error}</small>
          ${out.tx && html`<div className="mono" style=${{ marginTop: 6 }}>⛓ tx ${short(out.tx)}</div>`}</div><//>`}<//><//>
    <${Card} i=${1}><h2>Do they agree?</h2><p className="hint">Within ${tol} points of the building's own record, the contract verifies the pickup.</p>
      <div className="compare">
        <${motion.div} className="band" animate=${{ left: x(bin - tol), width: `${2 * tol}%` }} transition=${spring}/>
        <${motion.div} className="mark" style=${{ background: "#0d1b2e" }} animate=${{ left: x(bin) }} transition=${spring}><span>building ${bin.toFixed(1)}%</span><//>
        <${motion.div} className="mark" style=${{ background: Math.abs(fac - bin) <= tol ? "#1c9a63" : "#d93d42", top: 30 }} animate=${{ left: x(fac) }} transition=${spring}>
          <span style=${{ color: Math.abs(fac - bin) <= tol ? "#1c9a63" : "#d93d42" }}>facility ${fac.toFixed(1)}%</span><//>
      </div>
      <div className="row" style=${{ justifyContent: "space-between" }}><span className="mono">0%</span><span className="mono">100%</span></div><//>

// The background: a fine grid revealed only around the pointer, and a ring that trails it.
// Everything moves with transforms and CSS variables, so it stays smooth.
function Pointer() {
  const ring = useRef(null), dot = useRef(null), grid = useRef(null);
  useEffect(() => {
    if (matchMedia("(pointer: coarse)").matches) return;
    const m = { x: innerWidth / 2, y: innerHeight / 3, rx: innerWidth / 2, ry: innerHeight / 3, gx: innerWidth / 2, gy: innerHeight / 3, s: 1, ts: 1 };
    let raf, shown = false;
    const move = (e) => { m.x = e.clientX; m.y = e.clientY;
      const hot = e.target.closest?.("button, a, label.btn, input, select, textarea");
      m.ts = hot ? 1.9 : 1;
      if (!shown) { shown = true; ring.current.style.opacity = 1; dot.current.style.opacity = 1; } };
    const tick = () => {
      m.rx += (m.x - m.rx) * .16; m.ry += (m.y - m.ry) * .16; m.gx += (m.x - m.gx) * .08; m.gy += (m.y - m.gy) * .08; m.s += (m.ts - m.s) * .18;
      ring.current.style.transform = `translate3d(${m.rx - 18}px, ${m.ry - 18}px, 0) scale(${m.s})`;
      dot.current.style.transform = `translate3d(${m.x - 3}px, ${m.y - 3}px, 0)`;
      grid.current.style.setProperty("--mx", m.gx + "px"); grid.current.style.setProperty("--my", m.gy + "px");
      raf = requestAnimationFrame(tick);
    };
    addEventListener("mousemove", move, { passive: true }); raf = requestAnimationFrame(tick);
    return () => { cancelAnimationFrame(raf); removeEventListener("mousemove", move); };
  }, []);
  return html`<div>
    <div ref=${grid} className="gridfx" aria-hidden="true"></div>
    <div ref=${ring} className="cring" aria-hidden="true"></div><div ref=${dot} className="cdot" aria-hidden="true"></div></div>`;
}

      ${tab === "bin" ? html`<${BinTab} state=${state} refresh=${refresh} onDisposed=${setLast}/>`
        : tab === "building" ? html`<${BuildingTab} state=${state} refresh=${refresh}/>`
        : tab === "facility" ? html`<${FacilityTab} state=${state} refresh=${refresh}/>`
        : tab === "seal" ? null
        : html`<${VerifyTab} state=${state} lastEventId=${last}/>`}<//><//></main>`}
  </div>`;
}
const fieldEl = document.createElement("div"); document.body.insertBefore(fieldEl, document.getElementById("root"));
createRoot(fieldEl).render(html`<${Pointer}/>`);
createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
